name: Validate Agy-Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate all skill blueprints
        run: python3 scripts/validate-skill.py .

      - name: Run validator unit tests
        run: python3 scripts/test_validate_skill.py

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@cb71492574208e35ca6ec839d7a939e1416f8e2e # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
